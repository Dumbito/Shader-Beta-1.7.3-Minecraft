name: Build Beta173 Climate Bridge

on:
  push:
    branches:
      - main
    paths:
      - 'Beta173-Climate-Bridge/**'
      - '.github/workflows/build-climate-bridge.yml'
  pull_request:
    paths:
      - 'Beta173-Climate-Bridge/**'
      - '.github/workflows/build-climate-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Run tests and build mod
        working-directory: Beta173-Climate-Bridge
        run: gradle clean test build

      - name: Prepare downloadable files
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find Beta173-Climate-Bridge/build/libs -maxdepth 1 -type f -name 'beta173-climate-bridge-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" Beta173-Climate-Bridge-0.1.0-mc26.3.jar
          zip -qr Beta173-Climate-Bridge-0.1.0-source.zip Beta173-Climate-Bridge -x '*/build/*' '*/.gradle/*' '*/run/*' '*/.git/*'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta173-climate-bridge-0.1.0-mc26.3
          path: |
            Beta173-Climate-Bridge-0.1.0-mc26.3.jar
            Beta173-Climate-Bridge-0.1.0-source.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish JAR and source ZIP to main downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Beta173-Climate-Bridge-0.1.0-mc26.3.jar Beta173-Climate-Bridge-0.1.0-source.zip
          if git diff --cached --quiet; then
            echo 'Download files are already current.'
            exit 0
          fi
          git commit -m 'Publish Beta173 Climate Bridge build artifacts'
          git push origin HEAD:main
