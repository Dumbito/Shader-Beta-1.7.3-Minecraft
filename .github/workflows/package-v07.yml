name: Legacy package Beta173 Lighting v0.7.2 (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python test dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Run Python regression tests
        run: python3 -m unittest discover -s Beta173-Lighting/tests -p 'test_*.py' -v

      - name: Build shaderpack ZIP
        run: |
          cd Beta173-Lighting
          zip -r ../Beta173-Lighting-0.7.2.zip shaders
          unzip -t ../Beta173-Lighting-0.7.2.zip
          unzip -l ../Beta173-Lighting-0.7.2.zip

      - name: Publish v0.7.2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.2
          name: Beta173 Lighting v0.7.2 - Beta Cloud Cycle & Stars
          body: |
            Beta173 Lighting v0.7.2 — corrects two behaviors against the Minecraft Beta 1.7.3 source.

            - Ports the historical World.drawClouds color response for daylight, rain, and weighted thunder.
            - Restores the original RenderGlobal star RGBA output.
            - Keeps cloud geometry and alpha from Iris' CLOUDS pass.
            - The ZIP contains shaders/ at archive root.

            Validation: Python regression tests and ZIP integrity are checked automatically. Visual rendering still needs confirmation in Minecraft 26.3 with Iris 1.11.7; the CI job does not launch Minecraft or compile GLSL.
          files: Beta173-Lighting-0.7.2.zip
          fail_on_unmatched_files: true
