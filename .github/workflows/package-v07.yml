name: Package Beta173 Lighting v0.7.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Beta173-Lighting/**"
      - "README.md"
      - ".github/workflows/package-v07.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python regression tests
        run: python3 -m unittest discover -s Beta173-Lighting/tests -p 'test_*.py' -v

      - name: Build shaderpack ZIP
        run: |
          cd Beta173-Lighting
          zip -r ../Beta173-Lighting-0.7.1.zip shaders
          unzip -l ../Beta173-Lighting-0.7.1.zip

      - name: Publish ZIP on repository homepage
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish packaged v0.7.1 ZIP"
          file_pattern: Beta173-Lighting-0.7.1.zip

      - name: Publish v0.7.1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.1
          name: Beta173 Lighting v0.7.1 - Cloud & Star Fix
          body: |
            Beta173 Lighting v0.7.1 — corrective release for the v0.7 sky pass.

            - Adds an explicit Iris CLOUDS pass-through shader to preserve vanilla cloud geometry, vertex color, and alpha.
            - Prevents star brightness from being multiplied a second time by fragment alpha.
            - Keeps the existing Beta 1.7.3 sky, fog, and block-lighting implementation.
            - The ZIP contains shaders/ at archive root.

            Compatibility note: cloud rendering is affected by Iris/Sodium behavior that varies by Minecraft version. This build requires in-game verification on Minecraft 26.3 with Iris 1.11.7; no claim of a tested runtime fix is made until verified.
          files: Beta173-Lighting-0.7.1.zip
          fail_on_unmatched_files: true
