name: v0.9.0 universal climate RC1 validation and publish

on:
  push:
    branches:
      - main
      - feature/v0.9-universal-climate
    paths:
      - "Beta173-Lighting/**"
      - "Beta173-Climate-Bridge/**"
      - ".github/workflows/universal-climate.yml"
  pull_request:
    paths:
      - "Beta173-Lighting/**"
      - "Beta173-Climate-Bridge/**"
      - ".github/workflows/universal-climate.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shaderpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip numpy

      - name: Run all Python regression tests
        run: python -m unittest discover -s Beta173-Lighting/tests -p 'test_*.py' -v

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Build and validate universal shaderpack RC1
        shell: bash
        run: |
          set -euo pipefail
          python3 Beta173-Lighting/tools/build_pack.py 0.9.0-universal-rc1
          # The committed lookup PNG belongs to one seed and must not ship in the universal pack.
          if unzip -Z1 Beta173-Lighting-0.9.0-universal-rc1.zip | grep -q '^shaders/textures/beta173_climate_gradient.png$'; then
            zip -q -d Beta173-Lighting-0.9.0-universal-rc1.zip 'shaders/textures/beta173_climate_gradient.png'
          fi
          unzip -t Beta173-Lighting-0.9.0-universal-rc1.zip
          if unzip -Z1 Beta173-Lighting-0.9.0-universal-rc1.zip | grep -q '^shaders/textures/beta173_climate_gradient.png$'; then
            echo "Error: universal ZIP contains a climate lookup tied to a specific seed"
            exit 1
          fi
          mkdir -p /tmp/beta173-universal
          unzip -q Beta173-Lighting-0.9.0-universal-rc1.zip -d /tmp/beta173-universal
          python3 - <<'PY'
          from pathlib import Path
          root = Path("/tmp/beta173-universal")
          sky = (root / "shaders/gbuffers_skybasic.fsh").read_text()
          props = (root / "shaders/shaders.properties").read_text()
          assert "#include" not in sky
          assert "uniform float temperature;" in sky
          assert "beta173LegacyClimateAvailable" in sky
          assert "return temperature;" in sky
          assert "customTexture.beta173ClimateGradient" not in props
          assert "#define BETA_CLIMATE_SEED_CONFIGURED 1" not in sky
          assert not (root / "shaders/textures/beta173_climate_gradient.png").exists()
          for name in ("gbuffers_armor_glint", "gbuffers_clouds", "gbuffers_skybasic", "gbuffers_terrain", "gbuffers_textured_lit"):
              for suffix in (".vsh", ".fsh"):
                  source = (root / "shaders" / f"{name}{suffix}").read_text()
                  assert "#include" not in source, f"include not resolved: {name}{suffix}"
          print("Universal RC1 checks passed: no seed table or custom texture binding; automatic fallback; no includes.")
          PY
      - name: Link GLSL program pairs
        shell: bash
        run: |
          set -euo pipefail
          pack="/tmp/beta173-universal/shaders"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for program in gbuffers_armor_glint gbuffers_clouds gbuffers_skybasic gbuffers_terrain gbuffers_textured_lit; do
            cp "$pack/$program.vsh" "$tmp/$program.vert"
            cp "$pack/$program.fsh" "$tmp/$program.frag"
            glslangValidator -l "$tmp/$program.vert" "$tmp/$program.frag"
          done

      - name: Upload universal shaderpack RC1
        uses: actions/upload-artifact@v4
        with:
          name: Beta173-Lighting-0.9.0-universal-rc1
          path: Beta173-Lighting-0.9.0-universal-rc1.zip
          if-no-files-found: error
          retention-days: 14

  climate-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile the optional Iris bridge
        run: gradle -p Beta173-Climate-Bridge clean test build

      - name: Upload bridge mod build
        uses: actions/upload-artifact@v4
        with:
          name: Beta173-Climate-Bridge-0.1.0-experimental
          path: Beta173-Climate-Bridge/build/libs/beta173-climate-bridge-0.1.0.jar
          if-no-files-found: error
          retention-days: 14

  publish-main-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [shaderpack, climate-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download universal shaderpack
        uses: actions/download-artifact@v4
        with:
          name: Beta173-Lighting-0.9.0-universal-rc1
          path: /tmp/beta173-shaderpack

      - name: Download climate bridge
        uses: actions/download-artifact@v4
        with:
          name: Beta173-Climate-Bridge-0.1.0-experimental
          path: /tmp/beta173-bridge

      - name: Publish validated RC1 artifacts and checksums to main
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/beta173-shaderpack/Beta173-Lighting-0.9.0-universal-rc1.zip
          test -f /tmp/beta173-bridge/beta173-climate-bridge-0.1.0.jar
          # Another publishing workflow may have advanced main while these jobs ran.
          # Rebase asset publication on the latest main to avoid a non-fast-forward push.
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/beta173-shaderpack/Beta173-Lighting-0.9.0-universal-rc1.zip .
          cp /tmp/beta173-bridge/beta173-climate-bridge-0.1.0.jar Beta173-Climate-Bridge-0.1.0-experimental.jar
          sha256sum Beta173-Lighting-0.9.0-universal-rc1.zip Beta173-Climate-Bridge-0.1.0-experimental.jar > SHA256SUMS-v0.9-rc1.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Beta173-Lighting-0.9.0-universal-rc1.zip Beta173-Climate-Bridge-0.1.0-experimental.jar SHA256SUMS-v0.9-rc1.txt
          if git diff --cached --quiet; then
            echo "Candidate assets already published; no commit needed."
            exit 0
          fi
          git commit -m "build(v0.9): publish universal climate RC1 artifacts [skip ci]"
          git push origin HEAD:main
